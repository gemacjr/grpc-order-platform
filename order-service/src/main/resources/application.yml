spring:
  application:
    name: order-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  grpc:
    server:
      port: 9443
      host: 0.0.0.0
      shutdown-grace-period: 30s
      keep-alive:
        time: 30s
        timeout: 10s
        # Without this an idle client's pings are treated as abuse and the
        # connection is killed - the classic "works until traffic goes quiet" bug.
        permit-without-calls: true
        max-idle: 5m

server:
  shutdown: graceful

order:
  shutdown:
    # Time to let load balancers observe NOT_SERVING before the gRPC server
    # drains. Overridden to 0s in tests so the suite isn't taxed on every
    # Spring context teardown.
    pre-drain-wait: 2s

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  observations:
    key-values:
      service: ${spring.application.name}
