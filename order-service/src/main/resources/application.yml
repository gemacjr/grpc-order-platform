spring:
  application:
    name: order-service
  # Boot's SslMeterBinder eagerly reads every registered SSL bundle's
  # certificate files at startup to report expiry metrics - regardless of
  # spring.grpc.server.ssl.enabled - so simply defining the grpc-server PEM
  # bundle above makes cert files mandatory even when TLS is off. Excluded so
  # the bundle definition stays genuinely inert (no files on disk required)
  # until TLS is actually turned on.
  autoconfigure:
    exclude:
      - org.springframework.boot.micrometer.metrics.autoconfigure.ssl.SslMetricsAutoConfiguration
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  # PEM bundle backing the gRPC server's TLS credentials. Spring Boot's
  # PropertiesSslBundleRegistrar resolves the certificate/private-key files lazily -
  # only when a consumer actually asks the registry for this bundle by name - so
  # this definition is inert (and requires no files on disk) whenever
  # spring.grpc.server.ssl.enabled is false, which is the default.
  ssl:
    bundle:
      pem:
        grpc-server:
          keystore:
            certificate: ${GRPC_TLS_CERT:file:certs/server.crt}
            private-key: ${GRPC_TLS_KEY:file:certs/server.key}
  grpc:
    server:
      port: 9443
      host: 0.0.0.0
      shutdown-grace-period: 30s
      keep-alive:
        time: 30s
        timeout: 10s
        # Without this an idle client's pings are treated as abuse and the
        # connection is killed - the classic "works until traffic goes quiet" bug.
        permit-without-calls: true
        max-idle: 5m
      # GrpcServerProperties.Ssl (spring-grpc-server-spring-boot-autoconfigure 1.0.3)
      # exposes only enabled/clientAuth/bundle/secure - no certificate/private-key
      # fields - so TLS material must be wired through a named spring.ssl.bundle.*
      # bundle referenced here, not supplied inline.
      ssl:
        enabled: ${GRPC_TLS_ENABLED:false}
        bundle: grpc-server

server:
  # This is a gRPC-only service - the "data" port is grpc.server.port (9443)
  # above, not this one. Boot's actuator cannot serve HTTP endpoints
  # (health/prometheus/metrics) without a web-server starter, so
  # spring-boot-starter-web is pulled in purely to host actuator on a single
  # HTTP listener. That listener is bound here, on server.port, deliberately
  # instead of via management.server.port: if a *separate* management port
  # were configured, Boot would ALSO stand up a full main application server
  # on the default port 8080 that this service has no use for and never
  # wanted exposed. Keeping actuator on the one HTTP port (server.port) means
  # there is exactly one HTTP listener, serving only actuator endpoints.
  port: 9090
  shutdown: graceful

order:
  shutdown:
    # Time to let load balancers observe NOT_SERVING before the gRPC server
    # drains. Overridden to 0s in tests so the suite isn't taxed on every
    # Spring context teardown.
    pre-drain-wait: 2s
  security:
    # Off by default so tests and local runs work without a JWKS endpoint or
    # certificates. The gRPC service still re-validates any token it does see;
    # this flag only controls whether validation is enforced at all.
    enabled: ${ORDER_SECURITY_ENABLED:false}
    # Expected `iss`/`aud` claims. Defaults match JwtTestTokens so the test suite
    # keeps passing unchanged; override for real deployments.
    issuer: ${ORDER_SECURITY_ISSUER:https://dev.example.com}
    audience: ${ORDER_SECURITY_AUDIENCE:order-api}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE_RATE:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          # Boot 4 renamed this namespace. The Boot 3 key
          # `management.otlp.tracing.endpoint` binds to NOTHING here: Boot ignores
          # unknown keys silently, so the app starts clean and simply exports no
          # spans. Verified against spring-boot-micrometer-tracing-opentelemetry
          # 4.0.8 configuration metadata.
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  observations:
    key-values:
      service: ${spring.application.name}
