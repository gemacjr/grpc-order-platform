spring:
  application:
    name: order-api

  # Truststore for verifying the gRPC server's certificate. Resolved lazily by
  # Spring Boot's SSL bundle registry only when the bundle is actually requested
  # (i.e. when spring.grpc.client.channels.order-service.ssl.enabled is true), so
  # this is inert - and requires no file on disk - while TLS is off (the default).
  ssl:
    bundle:
      pem:
        grpc-client:
          truststore:
            certificate: ${GRPC_TRUST_STORE:file:certs/ca.crt}

  grpc:
    client:
      channels:
        order-service:
          address: static://localhost:9443
          negotiation-type: ${GRPC_NEGOTIATION:plaintext}
          # GrpcClientProperties.ChannelConfig.Ssl (spring-grpc-client-spring-boot-
          # autoconfigure 1.0.3) exposes only enabled/bundle - no trust-store field -
          # so, as on the server, TLS material is wired through a named bundle.
          ssl:
            enabled: ${GRPC_TLS_ENABLED:false}
            bundle: grpc-client
          health:
            enabled: true
            service-name: order.v1.OrderService
          enable-keep-alive: true
          keep-alive-time: 30s
          keep-alive-timeout: 10s
          keep-alive-without-calls: true

server:
  port: 8080

order:
  client:
    read-deadline: 2s
    write-deadline: 5s
  security:
    # Off by default so tests and local runs work without a JWKS endpoint; the
    # compose stack turns it on explicitly. See order-service's flag of the same
    # name - the gRPC service re-validates independently either way.
    enabled: ${ORDER_SECURITY_ENABLED:false}

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  observations:
    key-values:
      service: ${spring.application.name}

resilience4j:
  circuitbreaker:
    instances:
      order-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        # Business failures must not trip the breaker: a 404 means the backend is
        # healthy and answering correctly.
        ignore-exceptions:
          - com.example.order.api.client.exception.RemoteOrderNotFound
          - com.example.order.api.client.exception.RemoteValidationFailed
          - com.example.order.api.client.exception.RemoteIllegalTransition
          - com.example.order.api.client.exception.RemoteVersionConflict
  bulkhead:
    instances:
      order-service:
        max-concurrent-calls: 64
        max-wait-duration: 50ms
