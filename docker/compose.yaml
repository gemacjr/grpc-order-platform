name: order-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    # Host port 5433 to avoid clashing with any other local Postgres on 5432;
    # in-network traffic (order-service -> postgres:5432) is unaffected.
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4318:4318"]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9091:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  order-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      SPRING_DATASOURCE_USERNAME: orders
      SPRING_DATASOURCE_PASSWORD: orders
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      # --- TLS (disabled by default for this stack; see the commented block
      # below for how to turn it on) ---
      # --- Security (disabled by default; see the commented block below) ---
    ports: ["9443:9443", "9090:9090"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      # A native gRPC probe, not a TCP check: an open port proves nothing about
      # whether the service can actually serve.
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    # --- To enable mTLS between order-api and order-service, uncomment:
    # environment:
    #   GRPC_TLS_ENABLED: "true"
    #   GRPC_TLS_CERT: file:/certs/server.crt
    #   GRPC_TLS_KEY: file:/certs/server.key
    # volumes:
    #   - ./certs:/certs:ro
    #
    # --- To enable JWT auth enforcement (requires a real IdP/JWKS endpoint
    # reachable from the containers), uncomment:
    # environment:
    #   ORDER_SECURITY_ENABLED: "true"
    #   ORDER_SECURITY_ISSUER: https://your-idp.example.com
    #   ORDER_SECURITY_AUDIENCE: order-api

  order-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      # A hyphenated relaxed-binding env var (e.g.
      # SPRING_GRPC_CLIENT_CHANNELS_ORDER-SERVICE_ADDRESS) is not a legal
      # environment variable name and cannot reconstruct the hyphen in the
      # "order-service" channel name, so the channel address is supplied via
      # SPRING_APPLICATION_JSON instead.
      SPRING_APPLICATION_JSON: '{"spring":{"grpc":{"client":{"channels":{"order-service":{"address":"static://order-service:9443"}}}}}}'
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports: ["8080:8080", "8081:8081"]
    depends_on:
      order-service: { condition: service_healthy }
    # --- To enable mTLS to order-service, uncomment (must match order-service's
    # TLS block above):
    # environment:
    #   GRPC_TLS_ENABLED: "true"
    #   GRPC_NEGOTIATION: tls
    #   GRPC_TRUST_STORE: file:/certs/ca.crt
    # volumes:
    #   - ./certs:/certs:ro
    #
    # --- To enable JWT auth enforcement, uncomment (see order-service's block
    # above; both services must agree):
    # environment:
    #   ORDER_SECURITY_ENABLED: "true"
    #   ORDER_SECURITY_ISSUER: https://your-idp.example.com
    #   ORDER_SECURITY_AUDIENCE: order-api
