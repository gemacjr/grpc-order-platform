apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: order-api }
  template:
    metadata:
      labels: { app: order-api }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: order-api
          image: order-api:latest
          ports:
            - { name: http, containerPort: 8080 }
            - { name: mgmt, containerPort: 8081 }
          env:
            # A hyphenated relaxed-binding env var (e.g.
            # SPRING_GRPC_CLIENT_CHANNELS_ORDER-SERVICE_ADDRESS) is not a legal
            # environment variable name and cannot reconstruct the hyphen in the
            # "order-service" channel name, so the channel address is supplied
            # via SPRING_APPLICATION_JSON instead - the same working form used
            # in docker/compose.yaml.
            - name: SPRING_APPLICATION_JSON
              value: '{"spring":{"grpc":{"client":{"channels":{"order-service":{"address":"static://order-service:9443"}}}}}}'
            - name: OTLP_ENDPOINT
              value: http://jaeger-collector:4318/v1/traces
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: mgmt }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: mgmt }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: mgmt }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-api
spec:
  selector: { app: order-api }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: mgmt, port: 8081, targetPort: mgmt }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: order-api }
