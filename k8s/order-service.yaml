apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 2
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      # Must exceed the 2s pre-drain wait plus the 30s drain timeout from
      # ShutdownConfig / spring.lifecycle.timeout-per-shutdown-phase.
      terminationGracePeriodSeconds: 45
      containers:
        - name: order-service
          image: order-service:latest
          ports:
            - { name: grpc, containerPort: 9443 }
            - { name: mgmt, containerPort: 9090 }
          env:
            - name: OTLP_ENDPOINT
              value: http://jaeger-collector:4318/v1/traces
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          startupProbe:
            grpc: { port: 9443, service: order.v1.OrderService }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            grpc: { port: 9443, service: order.v1.OrderService }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: mgmt }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector: { app: order-service }
  ports:
    - { name: grpc, port: 9443, targetPort: grpc }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-service
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: order-service }
